name: Verify
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Must be a syntactically valid Convex deployment URL: the Convex
          # client parses the deployment name at startup and fatals (captured
          # as a page error) on names like "example".
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://limitless-schnauzer-971.convex.cloud' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Convex deploys after verification. Cloudflare builds from its connected main branch.
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Deploy Convex to production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy
