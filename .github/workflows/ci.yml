name: Verify
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Must be a syntactically valid Convex deployment URL: the Convex
          # client parses the deployment name at startup and fatals (captured
          # as a page error) on names like "example".
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://limitless-schnauzer-971.convex.cloud' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy the backend and build the frontend against that exact production URL.
  # The deploy stays idle until the credentials and production HTTP URL are configured.
  deploy:
    # NOTE: the `secrets` context is NOT available in job-level `if:` — using
    # it here makes the whole workflow fail at startup. Gate the deploy step
    # on the secrets instead (step-level `if:` does support `secrets`).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.CONVEX_DEPLOY_KEY != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.CONVEX_SITE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - name: Deploy Convex and build web against production
        if: env.HAS_DEPLOY_SECRETS == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          VITE_WORKOS_REDIRECT_URI: ${{ secrets.VITE_WORKOS_REDIRECT_URI || vars.VITE_WORKOS_REDIRECT_URI }}
        run: npx convex deploy --cmd "npm run web:build" --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Deploy to Cloudflare Workers
        if: env.HAS_DEPLOY_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
        run: npx wrangler deploy --var "CONVEX_SITE_URL:$CONVEX_SITE_URL"
