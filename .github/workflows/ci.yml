name: Verify
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Production deploy of the web frontend (vite build -> wrangler deploy).
  # Runs only after the verify job passes, on pushes to main (or a manual
  # workflow_dispatch so a deploy can be re-run from the Actions UI without a
  # new commit). Skips cleanly — job stays green, step reports skipped — while
  # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are still unset.
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      # VITE_* values are statically inlined into the bundle at build time, so
      # they must be present here, same as local `npm run deploy:web` inlines
      # web/.env. VITE_CONVEX_URL falls back to the dev deployment's public
      # cloud URL (already committed in wrangler.json vars).
      - name: Build web bundle
        run: npm run web:build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://limitless-schnauzer-971.convex.cloud' }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          VITE_WORKOS_REDIRECT_URI: ${{ secrets.VITE_WORKOS_REDIRECT_URI || vars.VITE_WORKOS_REDIRECT_URI }}
      - name: Deploy to Cloudflare Workers
        if: >-
          secrets.CLOUDFLARE_API_TOKEN != '' &&
          secrets.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
